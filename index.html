<style>
:root{--bg:#f1f2f4;--card:#fff;--head:#f8f8f9;--tx:#1b2330;--mut:#6b7686;--bd:#e3e5e9;--pri:#2563eb;--priTx:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eceef1}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#000;--head:#000;--tx:#f2f2f7;--mut:#9c9ca3;--bd:#2c2c2e;--pri:#4f8cff;--priTx:#0b1220;--chip:#2c2c2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0}
h3{font-size:14px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:10px}
.tabs button{border:0;background:none;color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px #0002;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:96px;text-align:left;color:var(--tx);font:inherit}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mut)}
.stat.bad b{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.add #nt{flex:1 1 260px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--pri)}
.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--priTx);border-color:var(--pri);font-weight:600}
.btn.sm{padding:4px 9px;font-size:13px}
.btn small{display:block;color:var(--mut);font-size:11px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.pill.on{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.task.urg{border-left-color:var(--warn)}
.task.late{border-left-color:var(--bad)}
.task.done{opacity:.55}
.task.done .ttitle{text-decoration:line-through}
.tmain{flex:1;min-width:0}
.ttitle{font-weight:600;word-break:break-word}
.tnotes{color:var(--mut);font-size:13px;white-space:pre-wrap;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--tx)}
.chip.bad{background:#dc262622;color:var(--bad);font-weight:600}
.chip.warn{background:#d9770622;color:var(--warn);font-weight:600}
.chip.ok{background:#16a34a22;color:var(--ok)}
.chip.mut{color:var(--mut)}
.star{border:0;background:none;font-size:20px;cursor:pointer;color:var(--bd);padding:0 2px;line-height:1}
.star.on{color:var(--warn)}
.tbtns{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.ib{border:0;background:none;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px;color:var(--tx)}
.ib:hover{background:var(--chip)}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.row.small{font-size:13px}
#bulk{position:fixed;left:50%;bottom:14px;transform:translate(-50%,calc(100% + 40px));opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;background:var(--card);border:1px solid var(--pri);box-shadow:0 6px 24px #0004;border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:20;max-width:calc(100vw - 20px)}
#bulk.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.modal{background:var(--card);border-radius:14px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{width:min(820px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.mb{padding:14px 16px;overflow:auto}
.mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mb label.f{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut)}
.mb input[type=text],.mb input[type=email],.mb input[type=search]{width:100%}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--tx)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:9px 16px;border-radius:99px;z-index:99;font-size:14px;backdrop-filter:blur(6px)}
.mgrid{display:grid;grid-template-columns:270px 1fr;gap:14px}
@media(max-width:800px){.mgrid{grid-template-columns:1fr}.tbtns{width:100%;justify-content:flex-start}.task{flex-wrap:wrap}}
.mi{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.mi.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.mi b{display:block}
.item{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
.item.ok{border-left:4px solid var(--ok)}
.ihead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.ihead .itx{flex:1}
.ihead>div{flex:1;min-width:0}
.att{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.att label{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.tabs button{border:0;background:var(--card);color:var(--tx);padding:6px 12px;cursor:pointer;font:inherit}.tabs button.on{background:var(--pri);color:#fff}
.ihead select{font-size:13px}.hint{font-size:12px;color:var(--mut);margin:8px 0 0}

/* --- Synchronisation « hors ligne d'abord » ---
   La copie locale (localStorage) est toujours la référence de travail : l'appli marche serveur coupé.
   Chaque élément modifié reçoit une date (updatedAt) ; les suppressions sont notées dans S.deleted.
   Dès que le serveur répond, les modifications partent ; si un autre appareil a modifié entre-temps, on fusionne. */
const HAS_SERVER=/^https?:/.test(location.protocol);
const SERVER=HAS_SERVER;
const SK='taches-sync',COLS=['tasks','meetings','groups'];
let REV=0,DIRTY=false,FIRST=true,VER=0,SYNC=HAS_SERVER?'wait':'local',pushT=null,SYNCING=false,AGAIN=false,RPEND=false,SNAP=new Map();
try{const j=JSON.parse(localStorage.getItem(SK));if(j){REV=+j.rev||0;DIRTY=!!j.dirty;FIRST=false}}catch(e){}
const persistSync=()=>{try{localStorage.setItem(SK,JSON.stringify({rev:REV,dirty:DIRTY}))}catch(e){}};
const syncLabel=()=>SYNC==='ok'?'☁ synchronisé':SYNC==='wait'?'☁ synchro…':SYNC==='auth'?"🔒 code d'accès requis (toucher)":SYNC==='off'?(DIRTY?'📴 hors ligne · modifs gardées ici (toucher)':'📴 hors ligne · copie locale (toucher)'):'💾 local à ce navigateur';
function setSync(s){SYNC=s;const el=$('#sync');if(el)el.textContent=syncLabel()}
const typing=()=>{const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&!['checkbox','date','radio','button'].includes(a.type)&&a.value)};
function snapAll(){SNAP=new Map();COLS.forEach(k=>(S[k]||[]).forEach(x=>{const c=Object.assign({},x);delete c.updatedAt;SNAP.set(x.id,JSON.stringify(c))}))}
/* date les éléments modifiés + note les suppressions (appelé à chaque save) */
function stamp(){
  const now=new Date().toISOString(),cur=new Set();
  COLS.forEach(k=>(S[k]||[]).forEach(x=>{
    cur.add(x.id);const c=Object.assign({},x);delete c.updatedAt;const j=JSON.stringify(c);
    if(SNAP.get(x.id)!==j){x.updatedAt=now;SNAP.set(x.id,j)}
  }));
  [...SNAP.keys()].forEach(id=>{if(!cur.has(id)){S.deleted[id]=now;SNAP.delete(id)}});
  const lim=new Date(Date.now()-90*864e5).toISOString();
  Object.keys(S.deleted).forEach(id=>{if(S.deleted[id]<lim)delete S.deleted[id]});
}
/* fusion : L = copie locale (avec modifs en attente), R = version du serveur. Élément par élément, le plus récent gagne. */
function merge(L,R){
  const out=Object.assign({},R,L);
  const del={};[R.deleted||{},L.deleted||{}].forEach(d=>Object.entries(d).forEach(([id,t])=>{if(!del[id]||t>del[id])del[id]=t}));
  COLS.forEach(k=>{
    const m=new Map();
    (L[k]||[]).forEach(x=>m.set(x.id,x));
    (R[k]||[]).forEach(y=>{const x=m.get(y.id);if(!x||(y.updatedAt||'')>(x.updatedAt||''))m.set(y.id,y)});
    out[k]=[...m.values()].filter(x=>!(del[x.id]&&del[x.id]>=(x.updatedAt||'')));
  });
  out.deleted=del;return norm(out);
}
function save(){
  stamp();

  if(HAS_SERVER){VER++;DIRTY=true;persistSync();setSync(navigator.onLine===false?'off':'wait');clearTimeout(pushT);pushT=setTimeout(sync,400)}
}

async function fx(method,body){
  const go=()=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
    return fetch('api/data',{method,cache:'no-store',signal:c.signal,headers:akHdr(body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined}).finally(()=>clearTimeout(t))};
  let r=await go();
  while(r.status===401&&askKey())r=await go();
  return r;
}
async function sync(){
  if(!HAS_SERVER)return;
  if(SYNCING){AGAIN=true;return}
  SYNCING=true;let changed=false;
  try{
    for(let i=0;i<5;i++){
      AGAIN=false;
      const r=await fx('GET');
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();
      const srv=j.data&&j.data.tasks?norm(j.data):null;
      if(srv&&(j.rev!==REV||FIRST)){
        S=DIRTY?merge(S,srv):srv;changed=true;
        snapAll();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      }
      REV=j.rev;FIRST=false;
      if(DIRTY||!srv){
        const v=VER;
        const p=await fx('PUT',{rev:REV,data:S});
        if(p.status===409){AGAIN=true;continue}
        if(!p.ok)throw new Error(p.status);
        REV=(await p.json()).rev;if(v===VER)DIRTY=false;
      }
      persistSync();
      if(!AGAIN)break;
    }
    setSync(DIRTY?'off':'ok');
  }catch(e){setSync(e&&e.message==='401'?'auth':'off');persistSync()}
  finally{SYNCING=false}
  if(changed){typing()?RPEND=true:render()}
}

  const late=isLate(t);
  const st=STATUSES.find(s=>s[0]===t.status)||STATUSES[0];
  const stp=stepOf(t);
  const mts=(t.meetings||[]).map(M).filter(Boolean);
  const dc=discussedCount(t);
  const left=(wfOf(t)&&!t.done?`<button class="wfic" data-act="done" data-id="${t.id}" title="Workflow ${esc(wfOf(t).name)} : marquer comme faite">${esc(wfOf(t).ic||'⛓')}</button>`
     :`<button class="circ ${t.done?'on':''}" data-act="done" data-id="${t.id}" title="${t.done?'Remettre à faire':'Marquer comme faite'}">${t.done?'✓':''}</button>`);
  const due=`<label class="pl ${t.due?(late?'bad':'set'):'empty'}"><span>📅<span class="lb"> ${t.due?'<i class="lbx">Échéance : </i>'+esc(dueText(t.due)):'Définir une échéance'}</span></span><input type="date" value="${esc(t.due||'')}" data-on="tDue" data-id="${t.id}" data-act="pickdate"></label>`;
  const est=selChip(t.est?'set':'empty',`⏱<span class="lb"> ${t.est?esc(fmtEst(t.est)):'Estimation'}</span>`,estOpts(t.est),t.est||0,'tEst',t.id);
  const who=t.assignee?selChip('set',`👤 ${esc(t.assignee)}`,[['','— Non assigné —'],...people().map(p=>[p.name,p.name]),...(people().some(p=>p.name===t.assignee)?[]:[[t.assignee,t.assignee]])],t.assignee,'tWho',t.id):'';
  const ro=[];
  if(t.carried>0)ro.push(`<span class="pl ro ${t.carried>=3?'warn':''}" title="Nombre de reconductions">↻ reconduite ${t.carried}×</span>`);
  if(t.mailCount>0)ro.push(`<span class="pl ro" title="Rappels envoyés par mail">✉ ${t.mailCount}× · dernier ${fmtTs(t.lastMail)}</span>`);
  if(dc>0)ro.push(`<span class="pl ro ok">🗓 évoquée ${dc}×</span>`);
  return `<div class="tkw">
  <article class="tk ${t.done?'done':''}">
   ${left}
   <div class="tmain">
    <div class="tt">${t.urgent?'<span class="ustar" title="Urgent">★</span> ':''}${esc(t.title)}${svcBadge(t)}</div>
    ${t.notes?`<div class="tnotes">${esc(t.notes)}</div>`:''}
    <div class="chips">
     ${stp?selChip('fill',`<i class="sd" style="background:${catCol(stp.cat)}"></i>${esc(stepLine(stp))}`,wfOf(t).steps.map(x=>[x.id,stepLine(x)]),t.wfs,'tStep',t.id):selChip('fill',`<i class="sd" style="background:${st[1]}"></i>${esc(st[0])}`,STATUSES.map(s=>[s[0],s[0]]),t.status,'tStatus',t.id)}
     <button class="pl ${subs.length?'set':'empty'}" data-act="subs" data-id="${t.id}"><span class="lb lbx">Sous-tâches </span>☑${subs.length?' '+sd+'/'+subs.length:''}</button>
     <span class="dotsep"></span>
     ${due}${est}${who}
     <button class="plus" data-act="edit" data-id="${t.id}" title="Plus d'options (responsable, projet, notes…)">+</button>
     ${ro.join('')}
    </div>
    ${UI.open.has(t.id)?subsPanel(t):''}
   </div>
   <input type="checkbox" class="sk" data-act="sel" data-id="${t.id}" ${UI.sel.has(t.id)?'checked':''} title="Sélectionner (ordre du jour, mail, déplacement…)">
   <button class="kb" data-act="tmenu" data-id="${t.id}" title="Actions">⋯</button>
  </article>
  ${mts.length?`<div class="also">Aussi dans :${mts.map(m=>`<button class="alsochip" data-act="openMeeting" data-m="${m.id}" title="${esc(m.title)}">● ${esc(short(m.title))}</button>`).join('')}</div>`:''}
  </div>`;
}
function subsPanel(t){
  return `<div class="subs">${(t.subs||[]).map(s=>`<div class="sub ${s.done?'done':''}"><button class="circ sm ${s.done?'on':''}" data-act="subdone" data-id="${t.id}" data-s="${s.id}">${s.done?'✓':''}</button><span>${esc(s.title)}</span><button class="ib" data-act="subdel" data-id="${t.id}" data-s="${s.id}" title="Retirer">✕</button></div>`).join('')}
   <div class="subadd"><input type="text" placeholder="Ajouter une sous-tâche…" data-enter="subAdd" data-id="${t.id}" spellcheck="true" lang="fr"><button class="btn sm" data-act="subadd" data-id="${t.id}">Ajouter</button></div></div>`;
}

const dataAttrs=d=>Object.entries(d||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ');
const prow=(ic,txt,act,d,o)=>{o=o||{};return `<button class="${o.cls||''}" data-act="${act}" ${dataAttrs(d)} ${o.keep?'data-keep="1"':''} ${o.col?`style="color:${o.col}"`:''}><span class="pi">${ic}</span><span class="pt">${txt}</span>${o.right?`<span class="pr">${o.right}</span>`:''}</button>`};
function popHtml(t){
  if(POP.view==='proj'){

     +prow(`<i class="sd" style="background:${GCOLORS[0]};margin:0"></i>`,'Autres tâches (aucun projet)','setproj',{id:t.id,g:''},{cls:cur===''?'cur':''})

     +'<hr>'+prow('✎','Modifier…','edit',{id:t.id})
     +prow('🗑','Supprimer','del',{id:t.id});
  }
  if(POP.view==='wf'){
    return prow('‹','Workflow','popview',{v:'main'},{keep:1,cls:'back'})+'<hr>'
     +prow(!t.wf?'●':'○','Aucun workflow','setwf',{id:t.id,w:''},{cls:!t.wf?'cur':''})
     +S.workflows.map(w=>prow(w.ic||'⛓',esc(w.name),'setwf',{id:t.id,w:w.id},{cls:t.wf===w.id?'cur':''})).join('')
     +'<hr>'+prow('⚙','Gérer les workflows…','gotoWf',{});
  }

  const pj=S.groups.find(g=>g.id===gidOf(t));
  return `<div class="phdr2">Changer de statut</div>`+stBody
   +prow('⛓','Workflow','popview',{v:'wf'},{keep:1,cls:'sec',right:(wf?esc(wf.ic+' '+short(wf.name,14))+' ':'')+'›'})
   +`<div class="phdr2">Projet<button data-act="pnew" data-id="${t.id}" title="Nouveau projet" class="phplus">＋</button></div>`
   +prow(pj?`<i class="sd" style="background:${pj.color};margin:0"></i>`:'📁',esc(pj?short(pj.name,22):'Autres tâches'),'popview',{v:'proj'},{keep:1,cls:'sec',right:'›'})
   +prow('⚙','Options supplémentaires','popview',{v:'opts'},{keep:1,cls:'sec',right:'›'});

function placePop(){
  const p=$('#pop'),a=POP.anchor;if(!a)return;
  p.style.visibility='hidden';p.style.display='block';
  const r=a.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  const left=Math.min(Math.max(8,r.right-w),innerWidth-w-8);
  let top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
  p.style.left=left+'px';p.style.top=top+'px';p.style.visibility='visible';
}
function openTaskPop(anchor,t){
  const p=$('#pop'),key='t'+t.id;
  if(p.style.display==='block'&&p.dataset.key===key){hidePop();return}
  Object.assign(POP,{id:t.id,view:'main',stOpen:true,anchor});
  p.innerHTML=popHtml(t);p.dataset.key=key;placePop();
}
function popRefresh(){const t=T(POP.id);if(!t)return hidePop();$('#pop').innerHTML=popHtml(t);placePop()}
function hidePop(){const p=$('#pop');if(p){p.style.display='none';p.dataset.key=''}}

function taskBadges(t){
  const b=[];
  if(t.due)b.push(`<span class="chip ${isLate(t)?'bad':''}">📅 ${fmt(t.due)}${isLate(t)?' · en retard':''}</span>`);else b.push('<span class="chip mut">sans échéance</span>');
  if(t.assignee)b.push(`<span class="chip">${svcOf(t.assignee)==='trans'?'📡':'👤'} ${esc(t.assignee)}</span>`);
  if(t.carried>0)b.push(`<span class="chip ${t.carried>=3?'warn':''}" title="Nombre de reconductions">↻ reconduite ${t.carried}×</span>`);
  if(t.mailCount>0)b.push(`<span class="chip" title="Rappels envoyés par mail">✉ ${t.mailCount}× · dernier ${fmtTs(t.lastMail)}</span>`);
  const dc=discussedCount(t);
  if(dc>0)b.push(`<span class="chip ok">🗓 évoquée ${dc}×</span>`);else if((t.meetings||[]).length)b.push('<span class="chip">🗓 inscrite en réunion</span>');
  if(t.agendaCount>0)b.push(`<span class="chip" title="Fois où cette tâche figurait dans un ordre du jour envoyé">📋 ${t.agendaCount}×</span>`);
  if(t.done)b.push('<span class="chip ok">✓ faite</span>');
  return b.join('');
}

  closeModal();const o=document.createElement('div');o.className='overlay';o.id='ov';

  document.body.appendChild(o);const i=o.querySelector('input[type=text],textarea');if(i)i.focus();return o;

function statRow(k,id,name,ts){
  const open=ts.filter(t=>!t.done),done=ts.length-open.length;
  const pct=ts.length?Math.round(done*100/ts.length):0;
  const late=open.filter(isLate).length,urg=open.filter(t=>t.urgent).length,blk=open.filter(t=>t.list==='blocked').length;
  return `<div class="srow" data-act="stats" data-k="${k}" data-id="${id}">
   <div class="srt"><b>${name}</b><span class="mut">${done}/${ts.length} faites</span></div>
   <div class="pbar sm"><i style="width:${pct}%"></i></div>
   <div class="srb"><span>${open.length} en cours</span><span>${ts.length-open.length} clôturée(s)</span>${blk?`<span style="color:#ef4444">🔴 ${blk} bloquée(s)</span>`:''}${urg?`<span style="color:#d97706">★ ${urg}</span>`:''}${late?`<span style="color:var(--bad,#dc2626)">⚠ ${late}</span>`:''}
    <span class="row" style="margin-left:auto;gap:4px"><button class="btn sm" data-act="stats" data-k="${k}" data-id="${id}">📊 Détail</button><button class="btn sm" data-act="odjFrom" data-k="${k}" data-id="${id}">🗓 ODJ</button></span></div>
  </div>`;
}
const SFL={open:['🔵','En cours',t=>!t.done],urgent:['★','Urgentes',t=>!t.done&&t.urgent],late:['⚠️','En retard',t=>!t.done&&isLate(t)],done:['🏁','Clôturées',t=>t.done]};
function viewFiltered(){
  const f=SFL[UI.sfilter]?UI.sfilter:'open';
  const [ic,lbl,fn]=SFL[f];
  const ts=S.tasks.filter(fn);
  let h=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${ic} ${lbl} (${ts.length})</h2>${f!=='done'&&ts.length?`<button class="btn pri sm" data-act="odjFilter" data-f="${f}">🗓 Ordre du jour</button>`:''}</div></div>`;

let IMP=[];
const normDate=x=>{x=String(x||'').trim();let m;if((m=x.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[0];if((m=x.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/)))return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return ''};
function fromJSON(o){
  const out=[];
  (function w(x){
    if(Array.isArray(x))return x.forEach(w);
    if(x&&typeof x==='object'){
      if(typeof x.title==='string'&&('status' in x||'due' in x||'notes' in x||'done' in x))
        out.push({title:x.title.trim(),notes:x.notes||'',due:normDate(x.due),done:x.status==='completed'||x.done===true,urgent:!!x.urgent,assignee:x.assignee||''});
      Object.values(x).forEach(v=>{if(v&&typeof v==='object')w(v)});
    }
  })(o);
  return out.filter(t=>t.title);
}
function fromICS(s){
  s=s.replace(/\r?\n[ \t]/g,'');const out=[];const re=/BEGIN:VTODO([\s\S]*?)END:VTODO/g;let m;
  while((m=re.exec(s))){
    const b=m[1];
    const g=k=>{const r=new RegExp('^'+k+'(?:;[^:\\r\\n]*)?:(.*)$','mi').exec(b);return r?r[1].replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1').trim():''};
    const d=g('DUE')||g('DTSTART');const pr=parseInt(g('PRIORITY')||'0',10);
    out.push({title:g('SUMMARY'),notes:g('DESCRIPTION'),due:/^\d{8}/.test(d)?d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8):'',done:/COMPLETED/i.test(g('STATUS'))||!!g('COMPLETED'),urgent:pr>0&&pr<=4,assignee:''});
  }
  return out.filter(t=>t.title);
}
function csvRows(s,d){const rows=[];let r=[],c='',q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}r.push(c);rows.push(r);return rows}
function fromCSV(s){
  const first=s.split(/\r?\n/)[0];const d=first.includes(';')?';':first.includes('\t')?'\t':',';
  const rows=csvRows(s,d).filter(r=>r.some(x=>x.trim()));const h=rows.shift().map(x=>x.trim().toLowerCase());
  const ix=(...n)=>h.findIndex(x=>n.includes(x));
  const ti=ix('title','titre','name','nom','tâche','tache','summary'),du=ix('due','échéance','echeance','date','due date'),no=ix('notes','note','description'),st=ix('status','statut','done','fait'),ur=ix('urgent','priorité','priorite','priority'),as=ix('assignee','responsable','assigné');
  return rows.map(r=>({title:(r[ti]||'').trim(),notes:no>=0?r[no]||'':'',due:du>=0?normDate(r[du]):'',done:st>=0?/^(1|true|oui|x|completed|fait|termin)/i.test((r[st]||'').trim()):false,urgent:ur>=0?/^(1|true|oui|x|urgent|high|haute)/i.test((r[ur]||'').trim()):false,assignee:as>=0?(r[as]||'').trim():''})).filter(t=>t.title);
}
function fromText(s){
  return s.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const done=/^[-*•]?\s*\[[xX]\]/.test(l);
    let t=l.replace(/^\s*(?:[-*•]|\[[ xX]?\]|\d+[.)])\s*/,'').replace(/^\[[ xX]?\]\s*/,'');
    const urgent=/^!/.test(t)||/\burgent\b/i.test(t);t=t.replace(/^!+\s*/,'');
    return {title:t,notes:'',due:'',done,urgent,assignee:''};
  }).filter(t=>t.title);
}
function parseAny(txt){
  const s=txt.trim();if(!s)return [];
  if(/^[\[{]/.test(s)){try{return fromJSON(JSON.parse(s))}catch(e){}}
  if(/BEGIN:VCALENDAR|BEGIN:VTODO/.test(s))return fromICS(s);
  const first=s.split(/\r?\n/)[0].toLowerCase();
  if(/(^|[;,\t])\s*"?(title|titre|name|nom|tâche|tache|summary)"?\s*([;,\t]|$)/.test(first))return fromCSV(s);
  return fromText(s);
}

function nextRecurDate(tp){
  const t=new Date();t.setHours(12,0,0,0);
  if(tp.recur==='m'){
    const dom=Math.min(28,+tp.dom||1);
    let d=new Date(t.getFullYear(),t.getMonth(),dom,12);
    if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,dom,12);
    return d.toISOString().slice(0,10);
  }
  if(tp.recur==='w2'){
    const last=S.meetings.filter(m=>m.tpl===tp.id).map(m=>m.date).sort().pop();
    if(last){const nd=new Date(last+'T12:00:00');do{nd.setDate(nd.getDate()+14)}while(nd<t);return nd.toISOString().slice(0,10)}
  }
  const dow=+tp.dow||1;const d=new Date(t);
  while(d.getDay()!==dow)d.setDate(d.getDate()+1);

  const t=it.taskId?T(it.taskId):null;const d=`data-m="${m.id}" data-i="${it.id}"`;
  const att=(it.note||'').trim()?`<div class="tnotes">Attendu : ${esc(it.note)}</div>`:'';
  const dur=`<span class="chip">⏱ ${fmtMin(+it.min||0)}</span>`;
  const head=it.taskId?(t?`<div><div class="ttitle">🔗 ${esc(t.title)}</div><div class="badges">${taskBadges(t)}${dur}</div>${att}</div>`:'<div class="ttitle mut">(tâche supprimée)</div>')
    :`<div><input type="text" class="itx" data-on="itText" ${d} value="${esc(it.text)}" placeholder="Point à aborder…" spellcheck="true" lang="fr" style="width:100%"><div class="badges">${dur}</div>${att}</div>`;
  const foot=t?`<div class="row small"><span class="mut">Resp. : ${esc(t.assignee||'—')}</span><button class="btn sm" data-act="done" data-id="${t.id}">${t.done?'↩ Remettre à faire':'✅ Terminer'}</button><button class="btn sm" data-act="tomorrow" data-id="${t.id}">⏰ Demain</button><input type="date" data-on="tDue" data-id="${t.id}" value="${esc(t.due||'')}" title="Échéance"><button class="btn sm" data-act="reco" data-id="${t.id}">↻ Reconduire</button></div>`
    :`<div class="row small"><select data-on="itOwner" ${d}>${whoOpts(it.owner)}</select><input type="date" data-on="itDue" ${d} value="${esc(it.due)}"><button class="btn sm" data-act="mkAction" ${d}>➜ Créer une action</button></div>`;
  return `<div class="item ${it.discussed?'ok':''}"><div class="ihead"><label class="chk"><input type="checkbox" data-on="itDisc" ${d} ${it.discussed?'checked':''}> évoqué</label>${head}<button class="ib" data-act="delItem" ${d} title="Retirer">✕</button></div>
   <textarea rows="2" data-on="itDec" ${d} placeholder="Commentaires / décisions…" spellcheck="true" lang="fr">${esc(it.decision)}</textarea>${foot}</div>`;
}
function addTasksModal(mid){
  const m=M(mid);const used=new Set(m.items.map(i=>i.taskId));
  const ts=S.tasks.filter(t=>!t.done&&!used.has(t.id)).sort((a,b)=>(b.urgent-a.urgent)||((a.due||'9')<(b.due||'9')?-1:1));
  MT=[];
  modal('Ajouter des tâches à la réunion',ts.length?`<label class="f">Rubrique</label><select id="mmRub">${RUBS.map(r=>`<option>${r}</option>`).join('')}</select><div style="margin-top:10px">${ts.map(t=>`<label class="chk" style="display:flex;padding:5px 0"><input type="checkbox" data-on="pickT" data-id="${t.id}"> ${t.urgent?'★ ':''}${esc(t.title)} <span class="mut">${t.due?'· '+fmt(t.due):''}</span></label>`).join('')}</div>`:'<p class="mut">Aucune tâche active à ajouter.</p>',
   `<button class="btn" data-act="close">Annuler</button><button class="btn pri" data-act="doAddTasks" data-m="${mid}">Ajouter</button>`);
}

/* ---- Rapport ---- */
const statusLabel=t=>t.done?'✓ Faite':t.list==='blocked'?'Bloquée':isLate(t)?'En retard':(t.status&&t.status!=='Non commencé'?t.status:'À faire');
function itemLabel(i){const t=i.taskId?T(i.taskId):null;return t?t.title:(i.text||'(sans titre)')}
function bar(segs,total){
  const used=segs.reduce((a,s)=>a+s.n,0);const rest=Math.max(0,total-used);
  return `<table role="presentation" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:collapse"><tr>${segs.filter(s=>s.n>0).map(s=>`<td style="width:${(s.n/total*100).toFixed(1)}%;background:${s.c};height:16px;font-size:0;line-height:0">&nbsp;</td>`).join('')}${rest>0?`<td style="background:#eef1f6;height:16px;font-size:0;line-height:0">&nbsp;</td>`:''}</tr></table>`;
}
function buildReport(m){
  const its=m.items;
  const acts=its.filter(i=>i.taskId&&T(i.taskId)).map(i=>({i,t:T(i.taskId)}));
  const dec=its.filter(i=>(i.decision||'').trim()).length;
  const open=acts.filter(a=>!a.t.done).length,done=acts.length-open;
  const who={};
  acts.forEach(({t})=>{const k=t.assignee||'Non assigné';const v=(who[k]=who[k]||{o:0,d:0,l:0});if(t.done)v.d++;else if(isLate(t))v.l++;else v.o++});
  const maxW=Math.max(1,...Object.values(who).map(v=>v.o+v.d+v.l));
  const byRub=RUBS.map(r=>({r,n:its.filter(i=>i.rubrique===r).length}));const maxR=Math.max(1,...byRub.map(x=>x.n));
  const th='style="text-align:left;padding:6px 8px;background:#eef1f6;font-size:12px;color:#445"';
  const td='style="padding:6px 8px;border-bottom:1px solid #e2e6ec;vertical-align:top;font-size:13px"';
  const kpi=(n,l,c)=>`<td style="text-align:center;padding:10px;background:#f5f6f8;border-radius:8px"><div style="font-size:24px;font-weight:700;color:${c}">${n}</div><div style="font-size:12px;color:#667">${l}</div></td><td style="width:8px"></td>`;
  let h=`<div style="font-family:Segoe UI,Arial,sans-serif;color:#1b2330;max-width:720px;font-size:14px">
  <h2 style="margin:0 0 4px;font-size:20px">${esc(m.title)}</h2>
  <div style="color:#667;margin-bottom:12px">${esc(fmtLong(m.date))}${m.attendees.length?' · Participants : '+esc(m.attendees.join(', ')):''}</div>
  <table role="presentation" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:separate"><tr>${kpi(its.length,'points abordés','#2563eb')}${kpi(dec,'décisions','#7c3aed')}${kpi(open,'actions ouvertes','#d97706')}${kpi(done,'actions terminées','#16a34a')}</tr></table>`;
  if(acts.length){
    h+=`<h3 style="margin:18px 0 6px;font-size:15px">Actions par personne</h3><div style="font-size:12px;color:#667;margin-bottom:6px"><span style="color:#2563eb">■</span> en cours &nbsp; <span style="color:#dc2626">■</span> en retard &nbsp; <span style="color:#16a34a">■</span> terminées</div>
    <table role="presentation" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:collapse">${Object.entries(who).map(([k,v])=>`<tr><td style="width:130px;padding:3px 8px 3px 0;font-size:13px">${esc(k)}</td><td style="padding:3px 0">${bar([{n:v.o,c:'#2563eb'},{n:v.l,c:'#dc2626'},{n:v.d,c:'#16a34a'}],maxW)}</td><td style="width:50px;text-align:right;font-size:13px;color:#667">${v.o+v.l+v.d}</td></tr>`).join('')}</table>`;
  }
  h+=`<h3 style="margin:18px 0 6px;font-size:15px">Points par rubrique</h3><table role="presentation" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:collapse">${byRub.map(x=>`<tr><td style="width:190px;padding:3px 8px 3px 0;font-size:13px">${esc(x.r)}</td><td style="padding:3px 0">${bar([{n:x.n,c:'#0891b2'}],maxR)}</td><td style="width:50px;text-align:right;font-size:13px;color:#667">${x.n}</td></tr>`).join('')}</table>`;
  RUBS.forEach(r=>{
    const l=its.filter(i=>i.rubrique===r);if(!l.length)return;
    h+=`<h3 style="margin:20px 0 6px;font-size:15px;border-bottom:2px solid #2563eb;padding-bottom:3px">${esc(r)}</h3><table role="presentation" style="width:100%;border-collapse:collapse">${l.map(i=>`<tr><td ${td}><b>${esc(itemLabel(i))}</b>${(i.decision||'').trim()?`<div style="margin-top:3px;color:#5b21b6">➜ ${esc(i.decision).replace(/\n/g,'<br>')}</div>`:''}</td></tr>`).join('')}</table>`;
  });
  if(acts.length){
    h+=`<h3 style="margin:20px 0 6px;font-size:15px;border-bottom:2px solid #2563eb;padding-bottom:3px">Actions à suivre</h3><table style="width:100%;border-collapse:collapse"><tr><th ${th}>Action</th><th ${th}>Resp.</th><th ${th}>Échéance</th><th ${th}>Statut</th><th ${th}>Historique</th></tr>${acts.map(({t})=>`<tr><td ${td}>${t.urgent?'<b style="color:#d97706">★ </b>':''}${esc(t.title)}</td><td ${td}>${esc(t.assignee||'—')}</td><td ${td}>${t.due?esc(fmt(t.due)):'—'}</td><td ${td}>${statusLabel(t)}</td><td ${td}>${t.carried?'↻ '+t.carried+'× ':''}${t.mailCount?'✉ '+t.mailCount+'×':''}</td></tr>`).join('')}</table>`;
  }
  const decRows=its.filter(i=>(i.decision||'').trim()).map(i=>{
    const t=i.taskId?T(i.taskId):null;
    return {txt:i.decision.trim(),pt:itemLabel(i),who:t?(t.assignee||'—'):(i.owner||'—'),due:t?(t.due||''):(i.due||''),st:i.decDone?'✅ appliquée':(t?statusLabel(t):'⏳ à suivre')};
  });
  if(decRows.length){
    h+=`<h3 style="margin:20px 0 6px;font-size:15px;border-bottom:2px solid #7c3aed;padding-bottom:3px">Suivi des décisions</h3><table style="width:100%;border-collapse:collapse"><tr><th ${th}>Décision</th><th ${th}>Point</th><th ${th}>Resp.</th><th ${th}>Échéance</th><th ${th}>État</th></tr>${decRows.map(r=>`<tr><td ${td}>${esc(r.txt).replace(/\n/g,'<br>')}</td><td ${td}>${esc(r.pt)}</td><td ${td}>${esc(r.who)}</td><td ${td}>${r.due?esc(fmt(r.due)):'—'}</td><td ${td}>${r.st}</td></tr>`).join('')}</table>`;
  }
  const prevDec=decList().filter(d=>d.m.id!==m.id&&!d.it.decDone).slice(0,15);
  if(prevDec.length){
    h+=`<h3 style="margin:20px 0 6px;font-size:15px;border-bottom:2px solid #7c3aed;padding-bottom:3px">Décisions en attente des réunions précédentes</h3><table style="width:100%;border-collapse:collapse"><tr><th ${th}>Décision</th><th ${th}>Réunion</th><th ${th}>Resp.</th><th ${th}>Échéance</th></tr>${prevDec.map(({m:pm,it})=>{const t=it.taskId?T(it.taskId):null;const who=t?(t.assignee||'—'):(it.owner||'—');const due=t?(t.due||''):(it.due||'');
     return `<tr><td ${td}>${esc(it.decision.trim()).replace(/\n/g,'<br>')}</td><td ${td}>${esc(pm.title)} <span style="color:#889">(${esc(fmt(pm.date))})</span></td><td ${td}>${esc(who)}</td><td ${td}>${due?esc(fmt(due)):'—'}</td></tr>`}).join('')}</table>`;
  }
  const blkT=S.tasks.filter(t=>!t.done&&t.list==='blocked');
  if(blkT.length){
    const gn=t=>{const g=t.group?S.groups.find(x=>x.id===t.group):null;return g?(g.ic?g.ic+' ':'')+g.name:'—'};
    h+=`<h3 style="margin:20px 0 6px;font-size:15px;border-bottom:2px solid #ef4444;padding-bottom:3px">Tâches bloquées (${blkT.length})</h3><table style="width:100%;border-collapse:collapse"><tr><th ${th}>Tâche</th><th ${th}>Projet</th><th ${th}>Statut</th><th ${th}>Resp.</th><th ${th}>Échéance</th></tr>${blkT.map(t=>{const st=stepOf(t);
     return `<tr><td ${td}>${t.urgent?'★ ':''}${esc(t.title)}</td><td ${td}>${esc(gn(t))}</td><td ${td}>${esc(st?st.ic+' '+st.name:(t.status||'En attente'))}</td><td ${td}>${esc(t.assignee||'—')}</td><td ${td}>${t.due?esc(fmt(t.due)):'—'}</td></tr>`}).join('')}</table>`;
  }
  h+=`<p style="color:#889;font-size:12px;margin-top:18px">Compte-rendu généré le ${esc(new Date().toLocaleDateString('fr-FR'))}. Merci de signaler toute correction.</p></div>`;
  return h;
}
function textReport(m){
  let s=`${m.title}\n${fmtLong(m.date)}\n${m.attendees.length?'Participants : '+m.attendees.join(', ')+'\n':''}\n`;
  RUBS.forEach(r=>{const l=m.items.filter(i=>i.rubrique===r);if(!l.length)return;s+=`== ${r} ==\n`;l.forEach(i=>{s+=`- ${itemLabel(i)}\n`;if((i.decision||'').trim())s+=`   Décision : ${i.decision.trim()}\n`;const t=i.taskId?T(i.taskId):null;if(t)s+=`   Resp. : ${t.assignee||'—'} · échéance ${t.due?fmt(t.due):'—'} · ${statusLabel(t)}\n`});s+='\n'});
  const dts=m.items.filter(i=>(i.decision||'').trim());
  if(dts.length){s+='== Suivi des décisions ==\n';dts.forEach(i=>{const t=i.taskId?T(i.taskId):null;s+=`- ${i.decision.trim().split('\n')[0]} (${t?(t.assignee||'—'):(i.owner||'—')}${(t?t.due:i.due)?' · '+fmt(t?t.due:i.due):''} · ${i.decDone?'appliquée':'à suivre'})\n`});s+='\n'}
  const pv=decList().filter(d=>d.m.id!==m.id&&!d.it.decDone).slice(0,15);
  if(pv.length){s+='== Décisions en attente des réunions précédentes ==\n';pv.forEach(({m:pm,it})=>{s+=`- ${it.decision.trim().split('\n')[0]} (${pm.title}, ${fmt(pm.date)})\n`});s+='\n'}
  const bk=S.tasks.filter(t=>!t.done&&t.list==='blocked');
  if(bk.length){s+=`== Tâches bloquées (${bk.length}) ==\n`;bk.forEach(t=>{const g=t.group?S.groups.find(x=>x.id===t.group):null;s+=`- ${t.urgent?'★ ':''}${t.title}${g?' ['+g.name+']':''}${t.assignee?' · '+t.assignee:''}${t.due?' · échéance '+fmt(t.due):''}\n`});s+='\n'}
  return s.trim();
}

}
function copyPrev(){
  const el=$('#repPrev');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}s.removeAllRanges();return ok;
}
function repLog(m,to){m.sentCount=(m.sentCount||0)+1;(m.sentLog=m.sentLog||[]).push({d:new Date().toISOString(),to});save()}

function renameRef(o,n){
  if(o===n)return;
  S.tasks.forEach(t=>{if(t.assignee===o)t.assignee=n});
  S.meetings.forEach(m=>{m.attendees=m.attendees.map(a=>a===o?n:a);m.items.forEach(i=>{if(i.owner===o)i.owner=n})});
}

/* ============ Actions (clics) ============ */
const ids=()=>[...UI.sel].filter(T);
const ACT={
  close(){closeModal()},
  syncNow(){sync()},
  tab(d){UI.view=d.v;render()},
  ltab(d){UI.tab=d.k;render()},
  sel(d,el){el.checked?UI.sel.add(d.id):UI.sel.delete(d.id);updateBulk()},
  selmode(){UI.selMode=!UI.selMode;if(!UI.selMode)UI.sel.clear();render()},
  selAll(){visible().forEach(t=>UI.sel.add(t.id));renderList()},
  selNone(){UI.sel.clear();renderList()},
  pickdate(d,el){try{el.showPicker&&el.showPicker()}catch(_){}},
  tmenu(d,el){const t=T(d.id);if(t)openTaskPop(el,t)},
  popview(d){POP.view=d.v;popRefresh()},
  pstatus(){POP.stOpen=!POP.stOpen;popRefresh()},

    if(m){
      const k=fold(m[1]);
      const g=S.groups.find(x=>fold(x.name)===k)||S.groups.find(x=>fold(x.name).startsWith(k))||S.groups.find(x=>fold(x.name).includes(k));
      if(g){group=g.id;v=v.slice(0,m.index).trim()}else toast('Projet « '+m[1].trim()+' » introuvable : tâche ajoutée sans projet');
    }

    if(UI.tab==='done')UI.tab='inbox';

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeModal();return}
  const inPop=!!e.target.closest('#pop');
  const a=e.target.closest('[data-act]');
  if(!inPop&&!(a&&a.dataset.act==='tmenu'))hidePop();
  if(!a)return;const f=ACT[a.dataset.act];if(f)f(a.dataset,a,e);
  if(inPop&&!a.dataset.keep)hidePop();
});
window.addEventListener('scroll',e=>{const n=e.target;if(n&&n.nodeType===1&&n.closest('#pop'))return;hidePop()},true);
window.addEventListener('resize',hidePop);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();hidePop()}
  if(e.key==='Enter'){
    if(e.target.id==='nt')ACT.addTask();
    else if(e.target.dataset&&e.target.dataset.enter==='subAdd')ACT.subadd(e.target.dataset);
    else if(e.target.dataset&&e.target.dataset.enter==='addPoint')ACT.addPoint(e.target.dataset);
  }
});
/* champs texte : mise à jour sans re-rendu (pas de perte de focus) */
document.addEventListener('input',e=>{
  const el=e.target,on=el.dataset.on;if(!on)return;
  const m=el.dataset.m?M(el.dataset.m):null,it=m?m.items.find(i=>i.id===el.dataset.i):null;
  if(on==='q'){UI.q=el.value;renderList()}
  else if(on==='mTitle'){m.title=el.value;saveSoon()}
  else if(on==='itText'){it.text=el.value;saveSoon()}
  else if(on==='itDec'){it.decision=el.value;saveSoon()}
  else if(on==='mLoc'){m.location=el.value;saveSoon()}
  else if(on==='mExtra'){m.extra=el.value;saveSoon()}
  else if(on==='itNote'){it.note=el.value;saveSoon()}
  else if(on==='meName'){S.me.name=el.value;saveSoon()}
  else if(on==='meEmail'){S.me.email=el.value;saveSoon()}
  else if(on==='memEmail'){S.team[+el.dataset.i].email=el.value;saveSoon()}
});
/* sélecteurs, cases, dates, fichiers */
document.addEventListener('change',e=>{
  const el=e.target,on=el.dataset.on;if(!on)return;
  const m=el.dataset.m?M(el.dataset.m):null,it=m?m.items.find(i=>i.id===el.dataset.i):null;
  if(on==='who'){UI.who=el.value;renderList()}
  else if(on==='tStep'){ACT.setstep({id:el.dataset.id,s:el.value})}
  else if(on==='tStatus'){T(el.dataset.id).status=el.value;save();render()}
  else if(on==='tEst'){T(el.dataset.id).est=+el.value||0;save();render()}
  else if(on==='tDue'){T(el.dataset.id).due=el.value;save();render()}
  else if(on==='tWho'){T(el.dataset.id).assignee=el.value;save();render()}
  else if(on==='bulkProj'){
    if(!el.value)return;const g=el.value==='_none'?'':el.value;
    ids().map(T).forEach(t=>t.group=g);UI.sel.clear();save();render();toast('Tâches rangées dans le projet');
  }
  else if(on==='mTime'){m.time=el.value||m.time;save();render()}
  else if(on==='itMin'){it.min=+el.value||10;save();render()}
  else if(on==='mDate'){m.date=el.value||m.date;save();render()}
  else if(on==='memSvc'){S.team[+el.dataset.i].svc=el.value;save();render()}
  else if(on==='mAtt'){const n=el.dataset.n;m.attendees=el.checked?[...new Set([...m.attendees,n])]:m.attendees.filter(x=>x!==n);save()}
  else if(on==='itDisc'){it.discussed=el.checked;save();render()}
  else if(on==='decOk'){it.decDone=el.checked;save();render()}
  else if(on==='tplNew'){const tp=S.mtpl.find(t=>t.id===el.value);el.value='';if(!tp)return;
    const m2=meetFromTpl(tp,todayISO());S.meetings.push(m2);UI.meet=m2.id;UI.mview='list';save();render();toast('Réunion créée depuis le modèle')}
  else if(on==='tplRecur'){const t=S.mtpl.find(x=>x.id===el.dataset.t);t.recur=el.value;save();ensureRecur();render()}
  else if(on==='tplDow'){const t=S.mtpl.find(x=>x.id===el.dataset.t);t.dow=+el.value;save();render()}
  else if(on==='tplDom'){const t=S.mtpl.find(x=>x.id===el.dataset.t);t.dom=+el.value;save();render()}
  else if(on==='itOwner'){it.owner=el.value;save()}
  else if(on==='itDue'){it.due=el.value;save()}
  else if(on==='pickT'){el.checked?MT.push(el.dataset.id):MT=MT.filter(x=>x!==el.dataset.id)}
  else if(on==='memName'){const i=+el.dataset.i,o=el.dataset.old,n=el.value.trim()||o;S.team[i].name=n;renameRef(o,n);el.dataset.old=n;save()}
  else if(on==='impFile'||on==='restoreFile'){
    const f=el.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{
      if(on==='impFile'){$('#impTxt').value=r.result;impAnalyse()}
      else{try{const j=JSON.parse(r.result);if(!j.tasks||!j.meetings)throw 0;if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){S=norm(j);save();UI.sel.clear();UI.meet=null;render();toast('Sauvegarde restaurée')}}catch(err){toast('Fichier de sauvegarde invalide')}}
    };r.readAsText(f);
  }
});
init();
if('serviceWorker' in navigator&&HAS_SERVER)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
